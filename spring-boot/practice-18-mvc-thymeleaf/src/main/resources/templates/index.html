<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Practice 18</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 720px;
            margin: 40px auto;
            line-height: 1.5;
        }

        .card {
            border: 1px solid #cccccc;
            border-radius: 12px;
            padding: 24px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${title}">Title</h1>
    <p th:text="${message}">Message</p>

    <h2>Items</h2>
    <ul>
        <li th:each="item : ${items}" th:text="${item}">Item</li>
    </ul>
</div>
</body>
</html>
